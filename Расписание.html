<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="color-scheme" content="light dark">
<title>Расписание</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f4f7;--card:#fff;--text:#14161a;--muted:#6b7280;--line:#e3e5ea;
  --accent:#2563eb;--accent-text:#fff;--seg:#e3e6ec;
  --lec:#2563eb;--prac:#16a34a;--lab:#d97706;--pe:#db2777;--oiz:#7c3aed;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--card:#1a1d24;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e38;
    --accent:#4f8bff;--accent-text:#0b0d12;--seg:#232731;
    --lec:#6ea0ff;--prac:#4ade80;--lab:#fbbf24;--pe:#f472b6;--oiz:#b794f6;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#1a1d24;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e38;
  --accent:#4f8bff;--accent-text:#0b0d12;--seg:#232731;
  --lec:#6ea0ff;--prac:#4ade80;--lab:#fbbf24;--pe:#f472b6;--oiz:#b794f6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
header{padding:16px 2px 10px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.seg{display:grid;gap:4px;background:var(--seg);padding:4px;border-radius:14px}
.seg.weeks{grid-template-columns:1fr 1fr;margin:6px 0 10px}
.seg.days{grid-template-columns:repeat(6,1fr);margin-bottom:14px}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--text);
  min-height:48px;border-radius:11px;cursor:pointer;position:relative;padding:0}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-text)}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--pe)}
.dayname{font-size:14px;color:var(--muted);margin:2px 4px 8px}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;margin-bottom:10px}
.time{flex:0 0 98px;text-align:left}
.time div{font-size:15px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.time div+div{margin-top:3px;color:var(--muted);font-weight:600}
.body{min-width:0;flex:1}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);margin:0 6px 6px 0}
.name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;
  padding:28px 16px;text-align:center;color:var(--muted)}
.both{font-size:12px;color:var(--muted);margin-left:2px}
</style>
</head>
<body>
<header>
  <h1>Расписание</h1>
  <div class="sub">Группа 10609226 · 1 курс · с 01.09 по 28.12</div>
</header>
<div class="seg weeks" id="weeks" role="tablist" aria-label="Неделя">
  <button role="tab" data-w="1">1 неделя</button>
  <button role="tab" data-w="2">2 неделя</button>
</div>
<div class="seg days" id="days" role="tablist" aria-label="День"></div>
<div class="dayname" id="dayname"></div>
<main id="list"></main>

<script>
// Каждая пара: [начало 1 половины, конец 1 половины, начало 2 половины, конец 2 половины] (перерыв 5 минут)
var SLOTS=[
  ["8:00","8:45","8:50","9:35"],
  ["9:55","10:40","10:45","11:30"],
  ["11:40","12:25","12:30","13:15"],
  ["13:55","14:40","14:45","15:30"],
  ["15:40","16:25","16:30","17:15"]
];
var DAYS=["ПН","ВТ","СР","ЧТ","ПТ","СБ"];
var DAYFULL=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
var TYPES={lec:["Лекция","--lec"],prac:["Практика","--prac"],lab:["Лабораторная","--lab"],pe:["Занятие","--pe"],oiz:["ОИЗ","--oiz"]};
// d: день (0=ПН), s: пара (0..4), w: недели, t: тип
var L=[
 {d:0,s:0,w:[1],t:"prac",n:"Философия",p:"проф.Лойко А.И.",r:"а 417 к 1"},
 {d:0,s:0,w:[2],t:"prac",n:"Математика",r:"а 453 к 1"},
 {d:0,s:1,w:[1,2],t:"lec",n:"Философия",p:"проф. Лойко А.И.",r:"а 439 к 1"},
 {d:0,s:2,w:[1],t:"prac",n:"Инженерная графика",p:"Бонад",r:"а 518 к 8"},
 {d:0,s:2,w:[2],t:"prac",n:"Инженерная графика",p:"Бонад",r:"а 518 к 8"},
 {d:0,s:3,w:[1,2],t:"prac",n:"Английский язык",p:"пр.Щербакова П.О.",r:"а 431 к 1"},
 {d:1,s:0,w:[1,2],t:"lec",n:"Химия",p:"доц.Стрелкова Е.В.",r:"502 к.18"},
 {d:1,s:1,w:[1,2],t:"prac",n:"Математика",r:"а 407 к 11"},
 {d:1,s:2,w:[1,2],t:"pe",n:"физическая культура",r:"спортзал 18к"},
 {d:2,s:0,w:[2],t:"lec",n:"Коррупция и ее общественная опасность",p:"пр.Милинкевич К.А.",r:"а 308 к 6"},
 {d:2,s:1,w:[1],t:"prac",n:"Информатика",r:"а 203 к 3"},
 {d:2,s:1,w:[2],t:"prac",n:"Химия",r:"а 510 к 11"},
 {d:2,s:2,w:[1],t:"oiz",n:"Математика",r:"а 315 к 6"},
 {d:2,s:2,w:[2],t:"lec",n:"Химия",r:"а 341 к 1"},
 {d:2,s:3,w:[1],t:"lec",n:"Математика",p:"ст.пр.Кожевко О.Ф.",r:"а 341 к 1"},
 {d:2,s:3,w:[2],t:"lec",n:"Введение в инженерное образование",p:"ст.пр.Артеменко К.И.",r:"а 341 к 1"},
 {d:3,s:0,w:[1,2],t:"prac",n:"Инженерная графика",p:"Бонад",r:"а 522 к 8"},
 {d:3,s:1,w:[1,2],t:"prac",n:"Информатика",p:"ст.пр.Конохов М.С.",r:"а 308 к 6"},
 {d:3,s:2,w:[1,2],t:"lab",n:"Информатика",r:"а 208 к 3"},
 {d:4,s:0,w:[1,2],t:"lec",n:"Инженерная графика",p:"ст.пр.Дорогокупец Т.В.",r:"а 4 П к 8"},
 {d:4,s:1,w:[1,2],t:"lec",n:"Математика",p:"ст.пр.Кожевко О.Ф.",r:"а 4 П к 8"},
 {d:4,s:2,w:[1,2],t:"pe",n:"физическая культура",r:"спортзал 18к"},
 {d:5,s:0,w:[2],t:"lec",n:"Инженерная графика",p:"ст.пр.Дорогокупец Т.В.",r:"4 П к 8",note:"ОИЗ"},
 {d:5,s:1,w:[2],t:"lec",n:"Математика",p:"ст.пр.Кожевко О.Ф.",r:"а 3 П к 8",note:"ОИЗ"}
];

function load(k,def){try{var v=localStorage.getItem(k);return v===null?def:v}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var todayIdx=(function(){var g=new Date().getDay();return g===0?-1:g-1})();
// Якорь: понедельник 12.10.2026 = 1 неделя. Дальше недели чередуются сами.
function calcWeek(){
  var n=new Date();
  var d=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(d.getDay()===0)d.setDate(d.getDate()+1); // воскресенье -> показываем следующую неделю
  var a=new Date(2026,9,12);
  var days=Math.round((d-a)/864e5);
  var k=Math.floor(days/7);
  return (((k%2)+2)%2===0)?1:2;
}
var curWeek=calcWeek();
var week=curWeek;
var day=todayIdx<0?0:todayIdx;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function renderDays(){
  var el=document.getElementById("days");
  el.innerHTML=DAYS.map(function(n,i){
    return '<button role="tab" data-d="'+i+'" aria-selected="'+(i===day)+'">'+n+(i===todayIdx?'<i class="dot"></i>':'')+'</button>';
  }).join("");
}
function renderWeeks(){
  document.querySelectorAll("#weeks button").forEach(function(b){
    var w=parseInt(b.dataset.w,10);
    b.setAttribute("aria-selected",String(w===week));
    b.innerHTML=w+" неделя"+(w===curWeek?'<i class="dot"></i>':'');
  });
}
function renderList(){
  document.getElementById("dayname").textContent=DAYFULL[day]+" · "+week+" неделя"+(day===todayIdx?" · сегодня":"");
  var items=L.filter(function(x){return x.d===day&&x.w.indexOf(week)>-1}).sort(function(a,b){return a.s-b.s});
  var list=document.getElementById("list");
  if(!items.length){list.innerHTML='<div class="empty">Выходной</div>';return}
  list.innerHTML=items.map(function(x){
    var t=TYPES[x.t];
    var sl=SLOTS[x.s];
    var meta=[];if(x.p)meta.push(esc(x.p));if(x.r)meta.push(esc(x.r));
    var both=x.w.length===2?'<span class="both">· обе недели</span>':'';
    return '<div class="card"><div class="time"><div>'+sl[0]+'–'+sl[1]+'</div><div>'+sl[2]+'–'+sl[3]+'</div></div>'+
      '<div class="body"><span class="tag" style="--c:var('+t[1]+')">'+t[0]+'</span>'+both+
      '<div class="name">'+esc(x.n)+'</div>'+
      (meta.length?'<div class="meta">'+meta.join(" · ")+'</div>':'')+
      (x.note?'<div class="note">'+esc(x.note)+'</div>':'')+
      '</div></div>';
  }).join("");
}
function renderAll(){renderWeeks();renderDays();renderList()}

document.getElementById("weeks").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  week=parseInt(b.dataset.w,10);renderAll();
});
document.getElementById("days").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  day=parseInt(b.dataset.d,10);renderDays();renderList();
});
renderAll();
</script>
</body>
</html>

</body></html>
